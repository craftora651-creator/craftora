<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Elevate Commerce - AI Assistant</title>
<!-- Tailwind CSS v3 CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- BEGIN: Custom Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'elevate-blue': '#0070f3',
            'elevate-dark': '#111827',
          },
          animation: {
            'bounce-slow': 'bounce 3s infinite',
            'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>
<!-- END: Custom Configuration -->
<!-- BEGIN: Custom Styles -->
<style data-purpose="speech-bubble-tail">
    /* Custom CSS for the speech bubble tail */
    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -10px;
      right: 30px;
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 10px solid white;
      filter: drop-shadow(0 4px 3px rgba(0, 0, 0, 0.07));
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="bg-gray-50 font-sans antialiased overflow-hidden h-screen">
<!-- BEGIN: Main Landing Content Placeholder -->
<main class="max-w-7xl mx-auto px-4 py-12">
<header class="mb-12">
<h1 class="text-4xl font-extrabold text-elevate-dark tracking-tight">Elevate Commerce</h1>
<p class="mt-4 text-xl text-gray-600">The premium marketplace for next-generation digital experiences.</p>
</header>
<div class="grid grid-cols-1 md:grid-cols-3 gap-8">
<!-- Decorative UI Elements to simulate a real site background -->
<div class="h-64 bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
<div class="h-4 w-24 bg-gray-200 rounded mb-4"></div>
<div class="h-32 w-full bg-gray-50 rounded mb-4"></div>
<div class="h-4 w-full bg-gray-100 rounded"></div>
</div>
<div class="h-64 bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
<div class="h-4 w-24 bg-gray-200 rounded mb-4"></div>
<div class="h-32 w-full bg-gray-50 rounded mb-4"></div>
<div class="h-4 w-full bg-gray-100 rounded"></div>
</div>
<div class="h-64 bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
<div class="h-4 w-24 bg-gray-200 rounded mb-4"></div>
<div class="h-32 w-full bg-gray-50 rounded mb-4"></div>
<div class="h-4 w-full bg-gray-100 rounded"></div>
</div>
</div>
</main>
<!-- END: Main Landing Content Placeholder -->
<!-- BEGIN: AI Assistant Overlay Container -->
<div class="fixed bottom-0 right-0 z-50 p-6 flex flex-col items-end pointer-events-none" data-purpose="ai-assistant-container" id="ai-assistant-wrapper">
<!-- BEGIN: Speech Bubble -->
<div class="speech-bubble mb-4 bg-white text-elevate-dark px-6 py-4 rounded-2xl shadow-xl border border-gray-100 animate-fade-in-up pointer-events-auto" data-purpose="assistant-message">
<p class="text-lg font-medium">Hey, sana yardım edeyim mi?</p>
</div>
<!-- END: Speech Bubble -->
<!-- BEGIN: Robot Character and Action Button -->
<div class="relative flex flex-col items-center">
<!-- Robot Image Container -->
<div class="w-48 h-48 md:w-64 md:h-64 transition-transform duration-300 hover:scale-105 pointer-events-auto" data-purpose="robot-character-display">
<img alt="Friendly 3D Robot Assistant waving" class="w-full h-full object-contain drop-shadow-2xl" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBxfpYM3imEyWbu8gQghSBLTwi50jnfz0_a8KtOkM8PtXFC8KkRgMt3UPs85ZVJSYvrdG15oBFHLR-uOlRRfnzXE9ReDKrxTFYBF490OL8pGZSTulkd8QUCXjdy3cqGJzdKaEyuC-GblRMCf68B1yOTVvNVLL1HGyLr-hpCL-vF0Hadg0BUeh334goBMwI9kwNcAEj7oXLolBaQFFPYRK0dcFYIvKX3s5qy9GenWxZyFZ8oBtaOak5TNVP2pKPwdi_kUNtgWsgdvN3b"/>
</div>
<!-- Help Button -->
<button class="mt-4 bg-elevate-blue hover:bg-blue-600 text-white font-semibold py-3 px-8 rounded-full shadow-lg transition-all transform hover:-translate-y-1 active:scale-95 flex items-center gap-2 pointer-events-auto" data-purpose="chat-button" id="chat-trigger">
<svg class="h-5 w-5" fill="currentColor" viewbox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z" fill-rule="evenodd"></path>
</svg>
        Chat with me
      </button>
</div>
<!-- END: Robot Character and Action Button -->
</div>
<!-- END: AI Assistant Overlay Container -->
<!-- BEGIN: Interactivity Script -->
<script data-purpose="ui-interactions">
    document.addEventListener('DOMContentLoaded', () => {
      const chatBtn = document.getElementById('chat-trigger');
      
      chatBtn.addEventListener('click', () => {
        // Log for demonstration, in production this would open a chat drawer/modal
        console.log('Chat assistant initialized');
        alert('Asistan sohbet penceresi açılıyor...');
      });
    });
  </script>
<!-- END: Interactivity Script -->
</body></html>
